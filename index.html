<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyBook - Home</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f0f2f5;
    color: #1c1e21;
}

/* ================= HEADER ================= */

header {
    height: 60px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    color: #1877f2;
    font-size: 30px;
    font-weight: bold;
}

.search {
    background: #f0f2f5;
    border-radius: 20px;
    padding: 10px 18px;
    width: 260px;
    border: none;
    outline: none;
}

.header-icons {
    display: flex;
    align-items: center;
    gap: 12px;
}

.icon {
    width: 40px;
    height: 40px;
    background: #e4e6eb;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
}

.profile-small {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #1877f2;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* ================= LAYOUT ================= */

.container {
    max-width: 1400px;
    margin: auto;
    display: grid;
    grid-template-columns: 250px 1fr 280px;
    gap: 25px;
    padding: 25px;
}

/* ================= SIDEBAR ================= */

.sidebar {
    position: sticky;
    top: 80px;
    height: fit-content;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 5px;
    font-weight: 600;
}

.menu-item:hover {
    background: #e4e6eb;
}

.menu-icon {
    font-size: 22px;
}

/* ================= MAIN ================= */

.main {
    max-width: 680px;
    width: 100%;
    margin: auto;
}

/* ================= STORIES ================= */

.stories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-bottom: 20px;
}

.story {
    min-width: 120px;
    height: 190px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1877f2, #8b5cf6);
    color: white;
    position: relative;
    overflow: hidden;
    cursor: pointer;
}

.story-content {
    position: absolute;
    bottom: 12px;
    left: 10px;
    font-weight: bold;
}

.story-avatar {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 40px;
    height: 40px;
    background: white;
    color: #1877f2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border: 3px solid #1877f2;
}

/* ================= CREATE POST ================= */

.card {
    background: white;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

.create-top {
    display: flex;
    gap: 10px;
    align-items: center;
}

.avatar {
    width: 42px;
    height: 42px;
    background: #1877f2;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.post-input {
    flex: 1;
    background: #f0f2f5;
    border: none;
    border-radius: 20px;
    padding: 12px 16px;
    outline: none;
    cursor: pointer;
}

.create-actions {
    border-top: 1px solid #ddd;
    margin-top: 15px;
    padding-top: 10px;
    display: flex;
    justify-content: space-around;
}

.create-action {
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    color: #606770;
    font-weight: bold;
}

.create-action:hover {
    background: #f0f2f5;
}

/* ================= POSTS ================= */

.post-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

.post-info strong {
    display: block;
}

.post-info small {
    color: #65676b;
}

.post-menu {
    margin-left: auto;
    cursor: pointer;
    font-size: 20px;
}

.post-text {
    margin: 15px 0;
    line-height: 1.5;
}

.post-image {
    width: 100%;
    height: 330px;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 35px;
    font-weight: bold;
}

.post-image.green {
    background: linear-gradient(135deg, #11998e, #38ef7d);
}

.reactions {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    color: #65676b;
    font-size: 14px;
}

.post-buttons {
    border-top: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    display: flex;
}

.post-button {
    flex: 1;
    text-align: center;
    padding: 10px;
    cursor: pointer;
    color: #65676b;
    font-weight: bold;
}

.post-button:hover {
    background: #f0f2f5;
}

.post-button.liked {
    color: #1877f2;
}

/* ================= RIGHT SIDEBAR ================= */

.right-sidebar {
    position: sticky;
    top: 80px;
    height: fit-content;
}

.right-title {
    color: #65676b;
    font-weight: bold;
    margin-bottom: 12px;
}

.contact {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
}

.contact:hover {
    background: #e4e6eb;
}

.contact-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #42b72a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    position: relative;
}

.online {
    width: 10px;
    height: 10px;
    background: #31a24c;
    border: 2px solid white;
    border-radius: 50%;
    position: absolute;
    bottom: 0;
    right: 0;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 1100px) {
    .container {
        grid-template-columns: 200px 1fr;
    }

    .right-sidebar {
        display: none;
    }
}

@media (max-width: 750px) {
    header {
        padding: 0 10px;
    }

    .search {
        width: 150px;
    }

    .container {
        display: block;
        padding: 10px;
    }

    .sidebar {
        display: none;
    }

    .main {
        max-width: 100%;
    }

    .header-icons .icon:nth-child(1),
    .header-icons .icon:nth-child(2) {
        display: none;
    }

    .story {
        min-width: 105px;
        height: 160px;
    }
}

@media (max-width: 450px) {
    .logo {
        font-size: 25px;
    }

    .search {
        width: 120px;
    }

    .post-image {
        height: 250px;
    }
}
</style>
</head>

<body>
